[Service]
# One process is required for the in-process job/cache locks, but serving a
# drawing with send_file occupies one gthread until the remote browser drains
# it. Browsers commonly request six thumbnails at once; four threads let those
# transfers starve /api/job and make a finished upload look frozen.
ExecStart=
ExecStart=/home/ubuntu/fence_lite/venv/bin/gunicorn -w 1 --threads 16 --worker-class gthread --timeout 900 --graceful-timeout 60 --access-logfile - --error-logfile - -b 0.0.0.0:5051 wsgi:app
