[Service]
# 8 vCPU / 15 GiB, no swap: overlap two PDFs while bounding their shared
# provider and local sidecar pressure. Arrow and line-type pages deliberately
# share one pool so their worst-case memory cannot stack independently.
Environment=MAX_PARALLEL_JOBS=2
Environment=GEMINI_MAX_CONCURRENCY=8
Environment=HEAVY_SIDECAR_SLOTS=2

# Host-level stage tuning. The base unit intentionally remains safe for the
# original 2-vCPU machine; this drop-in is the complete 8-vCPU/15-GiB profile
# installed by setup_ubuntu.sh on the current server.
Environment=VEC_WORKERS=4
Environment=TEXT_WORKERS=6
Environment=JUDGE_WORKERS=4
Environment=SYMBOLS_WORKERS=6
Environment=VIEW_WORKERS=6
Environment=ARROWS_WORKERS=2
Environment=LINETYPE_PAGE_WORKERS=2
Environment=LINETYPE_CPU_BUDGET=4
